name: Publish to Maven Central

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require a published release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" != refs/tags/* || ! "$RELEASE_TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Run this workflow on a release tag such as v1.2.3 or v1.2.3-rc.1.' >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != false ]]; then
            echo 'The tag must have a published GitHub release.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run checks
        run: ./gradlew check

      - name: Publish signed artifacts to Maven Central
        env:
          ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_releaseVersion: ${{ steps.release.outputs.version }}
          ORG_GRADLE_PROJECT_centralPortalPublishingType: AUTOMATIC

        run: ./gradlew publishAggregationToCentralPortal
